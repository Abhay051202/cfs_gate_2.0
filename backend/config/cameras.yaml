# Camera sources populate the per-slot dropdown. URLs stay in backend/.env.
camera_sources:
  - id: poe-camera-1
    name: PoE Camera 1 (IN Rear)
    source_env: CAMERA_1_RTSP
  - id: poe-camera-2
    name: PoE Camera 2 (IN Right)
    source_env: CAMERA_2_RTSP
  - id: poe-camera-3
    name: PoE Camera 3 (IN Left)
    source_env: CAMERA_3_RTSP
  - id: poe-camera-4
    name: PoE Camera 4 (OUT Front/Top)
    source_env: CAMERA_4_RTSP
  - id: poe-camera-5
    name: PoE Camera 5 (OUT Left)
    source_env: CAMERA_5_RTSP
  - id: poe-camera-6
    name: PoE Camera 6 (OUT Rear)
    source_env: CAMERA_6_RTSP

# 3 cameras per gate:
# 3 cameras configured for the IN gate (gate_id: lane-in): Rear, Right, Left
# 3 cameras configured for the OUT gate (gate_id: lane-out): Rear, Front/Approach
cameras:
  # --- GATE IN (3 CAMERAS) ---
  - id: gate-in-1
    name: Gate IN 1 (Rear)
    gate_id: lane-in
    source_env: CAMERA_1_RTSP
    direction: ENTRY
    role: REAR
    capture_fps: 10
    occupancy_roi: [0.04, 0.05, 0.65, 0.98]
  - id: gate-in-2
    name: Gate IN 2 (Right)
    gate_id: lane-in
    source_env: CAMERA_2_RTSP
    direction: ENTRY
    role: RIGHT
    capture_fps: 10
    occupancy_roi: [0.05, 0.08, 0.96, 0.98]
  - id: gate-in-3
    name: Gate IN 3 (Left)
    gate_id: lane-in
    source_env: CAMERA_3_RTSP
    direction: ENTRY
    role: LEFT
    capture_fps: 10
    enabled: true
    occupancy_roi: [0.28, 0.08, 0.98, 0.98]

  # --- GATE OUT (3 CAMERAS) ---
  - id: gate-out-1
    name: Gate OUT 1 (Rear/Lane)
    gate_id: lane-out
    source_env: CAMERA_4_RTSP
    direction: EXIT
    role: REAR
    capture_fps: 10
    occupancy_roi: [0.26, 0.05, 0.78, 0.96]
  - id: gate-out-2
    name: Gate OUT 2 (Front/Approach)
    gate_id: lane-out
    source_env: CAMERA_5_RTSP
    direction: EXIT
    role: FRONT_TOP
    capture_fps: 10
    occupancy_roi: [0.20, 0.05, 0.82, 0.96]
  - id: gate-out-3
    name: Gate OUT 3 (Rear)
    gate_id: lane-out
    source_env: CAMERA_6_RTSP
    direction: EXIT
    role: REAR
    capture_fps: 10
    enabled: false
